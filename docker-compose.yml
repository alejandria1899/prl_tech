services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: prl_tech_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      API_PROXY_TARGET: http://api:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: prl_tech_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-prl_user}:${POSTGRES_PASSWORD:-prl_password}@db:5432/${POSTGRES_DB:-prl_tech}
      THINGSPEAK_CHANNEL_ID: ${THINGSPEAK_CHANNEL_ID:-}
      THINGSPEAK_READ_API_KEY: ${THINGSPEAK_READ_API_KEY:-}
      THINGSPEAK_DEFAULT_RESULTS: ${THINGSPEAK_DEFAULT_RESULTS:-1000}
      THINGSPEAK_SYNC_ENABLED: ${THINGSPEAK_SYNC_ENABLED:-true}
      THINGSPEAK_SYNC_DEVICE_CODE: ${THINGSPEAK_SYNC_DEVICE_CODE:-home_dht22}
      THINGSPEAK_SYNC_INTERVAL_SECONDS: ${THINGSPEAK_SYNC_INTERVAL_SECONDS:-60}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: prl_tech_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prl_tech}
      POSTGRES_USER: ${POSTGRES_USER:-prl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prl_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prl_user} -d ${POSTGRES_DB:-prl_tech}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: prl_tech_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
